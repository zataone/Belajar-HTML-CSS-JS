<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planzer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/image/favicon.ico" type="image/x-icon" />
    <!-- <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
    </style> -->
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <!-- Logo -->
          <a href="#"><img src="assets/image/logo.svg" alt="Logo" /></a>

          <!-- Menu Desktop -->
          <div class="menu">
            <a href="#">Features</a>
            <a href="#">Use Case</a>
            <a href="#">Pricing</a>
          </div>

          <!-- Tombol CTA -->
          <div>
            <a href="#" class="sign">Sign in</a>
            <a href="#" class="cta">Get started For Free</a>
          </div>

          <!-- Tombol Burger (Mobile) -->
          <button class="burger" id="burger-btn" aria-label="Toggle Menu">
            <svg
              id="burger-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              width="24"
              height="24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 8h16M4 16h16"
              />
            </svg>
          </button>
        </nav>

        <!-- Menu Mobile -->
        <div class="mobile-menu" id="mobile-menu">
          <a href="#">Features</a>
          <a href="#">Use Case</a>
          <a href="#">Resources</a>
          <a href="#" class="sign">Sign in</a>
          <a href="#" class="cta">Get started For Free</a>
        </div>
      </div>
    </header>

    <section class="banner">
      <div class="jdl">
        <h1 class="title">Plan your day and synchronise it to your calendar</h1>
        <p class="desc">
          Planzer.io is a task planning app that allows you to plan all your
          tasks from multiple tools directly in your calendar.
        </p>

        <button class="cta2">start planning your day for free</button>
      </div>

      <div class="img-banner">
        <img src="assets/image/imgsectionone.svg" alt="Banner Image" />
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
